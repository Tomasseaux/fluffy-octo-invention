  <script>
    const canvas = document.getElementById('bg');
    const context = canvas.getContext('2d');

    let width;
    let height;
    let particles = [];
    const mouse = { x: null, y: null };

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('mousemove', (event) => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
    });

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2 + 0.5;
      }

      update() {
        if (mouse.x !== null && mouse.y !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 120) {
            this.x -= dx * 0.02;
            this.y -= dy * 0.02;
          }
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
          this.reset();
        }
      }

      draw() {
        context.beginPath();
        context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        context.fillStyle = 'rgba(0, 170, 255, 0.9)';
        context.fill();
      }
    }

    function drawConnections() {
      for (let index = 0; index < particles.length; index += 1) {
        for (let otherIndex = index + 1; otherIndex < particles.length; otherIndex += 1) {
          const dx = particles[index].x - particles[otherIndex].x;
          const dy = particles[index].y - particles[otherIndex].y;
          const distance = dx * dx + dy * dy;

          if (distance < 12000) {
            context.beginPath();
            context.strokeStyle = 'rgba(0, 170, 255, 0.08)';
            context.moveTo(particles[index].x, particles[index].y);
            context.lineTo(particles[otherIndex].x, particles[otherIndex].y);
            context.stroke();
          }
        }
      }
    }

    function initParticles() {
      particles = Array.from({ length: 110 }, () => new Particle());
    }

    function animate() {
      context.clearRect(0, 0, width, height);
      particles.forEach((particle) => {
        particle.update();
        particle.draw();
      });
      drawConnections();
      window.requestAnimationFrame(animate);
    }

    resizeCanvas();
    initParticles();
    animate();
  </script>
